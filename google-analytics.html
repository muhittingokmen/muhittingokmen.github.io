{%- comment -%}
  Google Analytics 4. The Measurement ID (G-XXXXXXXXXX) is set in _config.yml as google_analytics.
  Visitors whose browser sends "Do Not Track" are not tracked.
{%- endcomment -%}
{%- if site.google_analytics contains "G-" -%}
<script>
  if (!(window.doNotTrack === "1" || navigator.doNotTrack === "1" || navigator.doNotTrack === "yes" || navigator.msDoNotTrack === "1")) {
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}";
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", "{{ site.google_analytics }}", { anonymize_ip: true });
  }
</script>
{%- endif -%}
